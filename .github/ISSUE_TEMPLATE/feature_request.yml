name: Feature request
description: Ask for a new tool, a change to an existing one or anything that would make your work easier
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the task or the problem, not only the solution. For example, "find pages nobody has opened for a year".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the server help?
      description: A new tool, a parameter, a prompt, a setting. Any idea is welcome.
  - type: input
    id: client
    attributes:
      label: AI client
      description: Claude.ai, Claude Code, Cursor, VS Code, ...
  - type: textarea
    id: more
    attributes:
      label: Anything else
