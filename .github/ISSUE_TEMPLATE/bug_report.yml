name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Include the tool name and the error text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Server version
      description: Output of `docker compose exec server docmost-mcp-remote --version`, or the image tag.
  - type: input
    id: docmost
    attributes:
      label: Docmost version
  - type: input
    id: client
    attributes:
      label: AI client
      description: Claude.ai, Claude Code, Cursor, VS Code, ...
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: Relevant lines from `docker compose logs server`. Remove emails, page content and tokens first.
      render: text
