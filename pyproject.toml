[project]
name = "docmost-mcp-remote"
version = "1.0.0"
description = "Remote MCP server for Docmost Community Edition, with per-member sign-in, OAuth 2.1 and scoped access."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "bbik52" }]
keywords = ["mcp", "mcp-server", "docmost", "model-context-protocol", "oauth", "wiki"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "alembic>=1.20,<2",
    "asyncpg>=0.32,<1",
    "cryptography>=50,<51",
    "fastmcp>=4.1.3,<5",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1.6,<4",
    "pydantic-settings>=2.16,<3",
    "python-multipart>=0.0.32,<1",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<1",
]

[project.urls]
Homepage = "https://github.com/bbik52/docmost-mcp-remote"
Changelog = "https://github.com/bbik52/docmost-mcp-remote/blob/master/CHANGELOG.md"
Issues = "https://github.com/bbik52/docmost-mcp-remote/issues"
Security = "https://github.com/bbik52/docmost-mcp-remote/security/policy"

[project.scripts]
docmost-mcp-remote = "docmost_mcp_remote.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.18",
    "pip-audit>=2.9",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmost_mcp_remote"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: needs a running Docmost (DOCMOST_TEST_URL)"]
